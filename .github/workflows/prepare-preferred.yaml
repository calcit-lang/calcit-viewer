name: Prepare reviewed Viewer preferred calls
on:
  push:
    branches: [prepare/viewer-preferred031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve unchanged formal graph
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Complete original gates before edits
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --check-only --all-defs --format json > acceptance/all-before.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit analyze quality --baseline config/calcit-upgrade-baseline.json --format json > acceptance/quality-before.json
          calcit test --require-match --format json | tee acceptance/tests-before.json
          VITE_BASE_URL=./ yarn release
          node --test scripts/dispatch-regression.test.mjs | tee acceptance/js-before.tap
      - name: Official guarded two-call transaction
        run: node apply-reviewed.mjs
      - name: Complete original gates after edits
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs --format json > acceptance/all.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit analyze quality --baseline config/calcit-upgrade-baseline.json --format json > acceptance/quality.json
          calcit test --require-match --format json | tee acceptance/tests.json
          VITE_BASE_URL=./ yarn release
          node --test scripts/dispatch-regression.test.mjs | tee acceptance/js.tap
          git diff --quiet -- config/calcit-upgrade-baseline.json scripts/dispatch-regression.test.mjs deps.cirru package.json yarn.lock .yarnrc.yml
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R js-out acceptance/js-out
          cp -R dist acceptance/dist
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: viewer-preferred-source
          path: acceptance
          if-no-files-found: error
          retention-days: 30
