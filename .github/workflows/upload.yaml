name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@d02594b15f0e9de723fe1a202a3fa62a87afe07b # v1.4.0
      with:
        version: 0.18.1
        tools: calcit,caps

    - name: Validate and compile to JS
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze deprecated --summary-only
        calcit calcit.cirru analyze dynamic-methods --max 0
        calcit calcit.cirru analyze quality --baseline config/calcit-upgrade-baseline.json
        calcit calcit.cirru js
        yarn vite build --base=./

    - name: Select COS prefix
      id: cos-path
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "prefix=${GITHUB_REPOSITORY}/pr/" >> "$GITHUB_OUTPUT"
        else
          echo "prefix=${GITHUB_REPOSITORY}/" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload static assets to COS
      if: steps.cos-path.outcome == 'success'
      uses: worktools/cos-upload-action@0ce57b26b03dbdd27a4a544a06d453415932c62d # v1.0.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.cos-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Verify uploaded page through public CDN
      if: steps.cos-path.outcome == 'success'
      env:
        COS_ASSET_PREFIX: ${{ steps.cos-path.outputs.prefix }}
      run: |
        curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
          "https://cos-sh.tiye.me/${COS_ASSET_PREFIX}index.html?run=${GITHUB_RUN_ID}" \
          --output "$RUNNER_TEMP/cos-index.html"
        cmp dist/index.html "$RUNNER_TEMP/cos-index.html"

    - name: Deploy to server
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@b7f90f4f8ed893d4e3f852f7a73180631f63d4bd # v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
