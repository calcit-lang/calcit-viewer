name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Install and validate dependencies
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml

      - name: Check Calcit snapshot
        run: |
          set -euo pipefail
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit calcit.cirru edit format
          git diff --quiet -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          report="$(calcit calcit.cirru fix --workflow strict --verify --format json)"
          printf '%s\n' "$report"
          jq -e '.data.workflow.status == "passed" and .diagnostics == []' <<< "$report"
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru analyze quality --baseline config/calcit-upgrade-baseline.json
          calcit calcit.cirru test --require-match --summary-only

      - name: Build client with CDN asset URLs
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          fi
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
          yarn compile
          yarn build
          node --test scripts/dispatch-regression.test.mjs

      - name: Upload and verify static assets on COS
        timeout-minutes: 10
        # Dependabot PRs do not receive ordinary Actions deployment secrets.
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy to server
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
